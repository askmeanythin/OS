# Smart Exam Lab - client agent configuration (copy to client.conf)
# Unique ID for THIS lab PC - every computer must use a different pc_id.
pc_id=PC-01
# The server computer's LAN IPv4 address (find it with `ipconfig` on the server).
server_host=192.168.1.10
port=5050
# Must match the server's lab_token exactly.
lab_token=CHANGE-ME-LAB-TOKEN
# Comma-separated required software executables to check on this PC (optional).
# Example: required_software=code.exe,chrome.exe
required_software=
heartbeat_interval_s=5
