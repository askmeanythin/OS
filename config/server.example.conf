# Smart Exam Lab - server configuration (copy to server.conf)
# Bind address: 0.0.0.0 = all interfaces (lab LAN). Use the server's LAN IP
# to restrict further. NEVER expose this port to the public internet.
bind_addr=0.0.0.0
port=5050
db_path=data/examlab.db
# Provisioning token shared with client agents. Change this before real use,
# set the same value in every client.conf, and do not commit the real value.
lab_token=CHANGE-ME-LAB-TOKEN
heartbeat_interval_s=5
cpu_warn_pct=85
ram_warn_pct=90
heartbeat_timeout_s=30
